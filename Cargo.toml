[package]
name = "fb2-clean"
version = "0.5.1"
authors = ["Ivan Reutov <nujievik@gmail.com>"]
edition = "2024"
rust-version = "1.85"
description = "A simple GUI/CLI utility to remove images from fb2 books."
repository = "https://github.com/nujievik/fb2-clean"
license = "MIT OR Apache-2.0"
keywords = ["cli", "utility"]
categories = ["command-line-utilities"]
default-run = "fb2-clean"

include = [
    "Cargo.toml",
    "README.md",
    "assets/logo.png",
    "src/**",
]

[[bin]]
name = "fb2-clean"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "Fb2CleanGui"
path = "src/main_gui.rs"
required-features = ["gui"]

[features]
default = ["cli"]
cli = ["clap", "enable-ansi-support"]
gui = ["eframe", "rfd", "image"]

[dependencies]
clap = { version = "4.5", optional = true }
eframe = { version = "0.33.3", optional = true }
either = "1"
image = { version = "0.25", optional = true }
indexmap = "2"
lazy-regex = "3"
log = "0.4"
quick-xml = "0.38"
rayon = "1"
rfd = { version = "0.17", optional = true }
walkdir = "2"
zip = "6"

[target.'cfg(windows)'.dependencies]
enable-ansi-support = { version = "0.3.1", optional = true}
winapi = { version = "0.3", features = ["winnls"] }
