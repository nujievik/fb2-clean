name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.2.3)'
        required: true
        default: 'v1.2.3'

env:
  CARGO_TERM_COLOR: always

jobs:
  aur-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set VERSION env
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Update and Deploy to AUR
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          PKGNAME: "fb2-clean"
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$AUR_KEY" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key

          cat <<EOF > ~/.ssh/config
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur_key
            IdentitiesOnly yes
            StrictHostKeyChecking no
          EOF
          chmod 600 ~/.ssh/config

          cd /tmp
          git clone "ssh://aur@aur.archlinux.org/${PKGNAME}.git" aur_repo
          
          cp "$GITHUB_WORKSPACE/PKGBUILD" aur_repo/PKGBUILD
          cd aur_repo

          sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD # Сбрасываем релиз в 1 при новой версии

          sudo apt-get update && sudo apt-get install -y pacman-package-utilities

          updpkgsums

          makepkg --printsrcinfo > .SRCINFO

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add PKGBUILD .SRCINFO
          
          if ! git diff-index --quiet HEAD; then
            echo "Update to v${VERSION}"
          else
            echo "No changes to commit."
          fi
